services:
  onoh-php-fpm:
    image: ghcr.io/fredchess/onenation_oneheart:latest
    pull_policy: always
    restart: unless-stopped
    volumes:
      - storage-data:/var/www/storage
    env_file:
      - .env
    networks:
      - onoh
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pidof php-fpm || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Planificateur Laravel (transferts automatiques). Contourne l'entrypoint : les migrations
  # sont déjà lancées par onoh-php-fpm.
  onoh-scheduler:
    image: ghcr.io/fredchess/onenation_oneheart:latest
    pull_policy: always
    restart: unless-stopped
    entrypoint: ["php", "artisan", "schedule:work"]
    volumes:
      - storage-data:/var/www/storage
    env_file:
      - .env
    networks:
      - onoh
      - dokploy-network
    depends_on:
      onoh-php-fpm:
        condition: service_healthy

  onoh-nginx:
    build:
      context: ..
      dockerfile: docker/nginx/Dockerfile
      args:
        GITHUB_REPOSITORY: fredchess/onenation_oneheart
        IMAGE_TAG: ${IMAGE_TAG:-latest}
      pull: true
    restart: unless-stopped
    volumes:
      - storage-data:/var/www/storage
    depends_on:
      onoh-php-fpm:
        condition: service_healthy
        restart: true
    networks:
      - onoh

  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - onoh
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  typesense:
    image: typesense/typesense:28.0
    restart: unless-stopped
    command: --data-dir /data --api-key=${TYPESENSE_API_KEY:?TYPESENSE_API_KEY must be set} --enable-cors=false
    volumes:
      - typesense-data:/data
    networks:
      - onoh

volumes:
  storage-data:
  typesense-data:

networks:
  onoh:
  dokploy-network:
    external: true